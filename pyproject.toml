[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intellivest-mas"
version = "0.1.0"
description = "Hybrid multi-agent financial advisory system: portfolio analysis, risk assessment, and suitability-aware investment recommendation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Parhavi G.V" },
  { name = "Akkihebbal Bhargava Surya" },
  { name = "Mekala Kirthana" },
  { name = "Shefali Chimmanda Ganapati" },
]
keywords = [
  "financial-advisory",
  "portfolio-optimization",
  "risk-management",
  "multi-agent-systems",
  "llm",
  "explainable-ai",
]
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.11,<2.0",
  "scikit-learn>=1.4,<2.0",
  "pydantic>=2.7,<3.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0", "pytest-cov>=5.0,<6.0"]

[project.scripts]
intellivest-advise = "intellivest.cli:advise_main"
intellivest-evaluate = "intellivest.cli:evaluate_main"

[tool.setuptools.packages.find]
include = ["intellivest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
